 
{% extends 'base.html' %}
{% load crispy_forms_tags %}

{% block title %}Login - Solicita{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
        <div class="card card-custom p-4">
            <h3 class="text-center text-primary mb-3">
                <i class="fa-solid fa-right-to-bracket me-2"></i>Acessar o Solicita
            </h3>
            <form method="post">
                {% csrf_token %}
                {{ form|crispy }}
                <div class="d-grid gap-2 mt-4">
                    <button type="submit" class="btn btn-primary btn-lg">Entrar</button>
                </div>
            </form>
            <div class="text-center mt-3">
                <small class="text-muted">Ainda não tem conta? <a href="{% url 'registro' %}">Cadastre-se</a></small>
            </div>
        </div>
    </div>
</div>
{% endblock %}
